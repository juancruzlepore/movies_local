[package]
name = "movies_local_backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "signal"] }
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls", "gzip"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
tower-http = { version = "0.5", features = ["cors"] }
aws-config = { version = "1.6.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = { version = "1.96.0", features = ["behavior-version-latest"] }
